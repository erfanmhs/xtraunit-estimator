# XtraUnit Estimator — Render deployment blueprint.
#
# ONE always-on Node web service running the Next.js app. "Always-on" is the
# point: the app's AI jobs (scope generation, pricing) keep running in the
# background for minutes after the request returns, so the server must stay up.
#
# Secrets are set in the Render dashboard (Environment tab), never in git —
# that's what `sync: false` means below: "a human fills this in."
#
# SCALING: with SUPABASE_SERVICE_ROLE_KEY set (and migration 0034 run), AI
# runs are durable queued jobs claimed from Postgres by an in-process worker
# on each instance — so this service CAN run more than one instance (set
# numInstances, or scale in the dashboard) and jobs survive deploys. Without
# the key, jobs run inside the one process as before. Database (Supabase)
# scales independently by tier. See DEPLOY.md and docs/jobs.md.

services:
  - type: web
    name: xtraunit-estimator
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health # 503 when the database is unreachable, not just when the app is
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Turns on the durable job queue (see docs/jobs.md). Supabase → Settings → API.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Self-service sign-up. Set to "false" once partner accounts exist.
      - key: NEXT_PUBLIC_ALLOW_SIGNUP
        value: "true"
      # Error tracking (Sentry) — optional. Leave blank and nothing is sent.
      # See .env.local.example for what each one is.
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
